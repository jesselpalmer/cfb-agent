[project]
name = "cfb-agent"
version = "0.1.0"
description = "A multi-agent AI system for college football information"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # LLM/Agent framework
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "torch",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=25.11.0",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
