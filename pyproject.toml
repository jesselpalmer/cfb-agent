[project]
name = "cfb-agent"
version = "0.1.0"
description = "A multi-agent AI system for college football information"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM/Agent framework
    "langchain>=1.5,<2",
    "langchain-openai>=1.8,<2",
    "langchain-core>=1.8,<2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Ruff defaults plus import sorting and bugbear.
extend-select = ["I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
